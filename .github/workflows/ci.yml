name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '7 3 * * 1'   # every Monday 03:07 UTC
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    env:
      CC: clang-15
      CXX: clang++-15

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang-15 cmake ninja-build \
            libsodium-dev nlohmann-json3-dev \
            libssl-dev python3-pip

      # -- emp-toolkit ------------------------------------------
      # Installed into a *user-writable* prefix ($HOME/.local) so the cache can
      # restore it as the unprivileged runner.  The old /usr/local path failed
      # cache restore with `tar: ... Cannot open: Permission denied`, forcing a
      # full ~27 min rebuild of emp-tool/emp-ot/emp-sh2pc on every run.
      # CMakeLists.txt already appends $HOME/.local to CMAKE_PREFIX_PATH, so
      # the mpmt build finds emp here with no extra configuration.
      - name: Cache emp-toolkit
        id: cache-emp
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/lib
            ~/.local/include
          key: emp-${{ hashFiles('.github/install-deps.sh') }}

      - name: Build emp-toolkit
        # Guard on the installed cmake config (not just cache-hit) so a partial
        # or poisoned cache heals itself instead of skipping the build.
        run: |
          if [ ! -f "$HOME/.local/lib/cmake/emp-sh2pc/emp-sh2pc-config.cmake" ]; then
            export EMP_INSTALL_PREFIX="$HOME/.local"
            .github/install-deps.sh emp-tool
            .github/install-deps.sh emp-ot
            .github/install-deps.sh emp-sh2pc
          else
            echo "emp-toolkit restored from cache; skipping build"
          fi

      # -- Python env -------------------------------------------
      # Cache pip's HTTP download cache so the runtime deps from pyproject
      # (cloudpickle, flask, numpy) and the build tools (nanobind,
      # scikit-build-core) are fetched without re-downloading on reruns.
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('pyproject.toml') }}

      - name: Upgrade pip
        run: pip install --upgrade pip

      # -- mpmt wheel (the C++ build, cached) -------------------
      # `pip install -e .` recompiles the entire extension on every run: the
      # isolated build env gives nanobind a different path each time, so ninja
      # never reuses object files.  Build a wheel once and cache it; on cache
      # hit the install below just unpacks the wheel (no C++ compile; a cold
      # build is ~5 min locally).
      - name: Cache mpmt wheel
        uses: actions/cache@v4
        with:
          path: ~/mpmt-wheelhouse
          key: mpmt-${{ hashFiles('.github/install-deps.sh', 'pyproject.toml', 'CMakeLists.txt', 'src/**', 'include/**') }}

      - name: Build mpmt wheel (if not cached)
        run: |
          if ls "$HOME"/mpmt-wheelhouse/mpmt-*.whl >/dev/null 2>&1; then
            echo "mpmt wheel restored from cache; skipping build"
          else
            mkdir -p "$HOME/mpmt-wheelhouse"
            pip wheel . -w "$HOME/mpmt-wheelhouse" --no-deps
          fi

      - name: Install mpmt
        run: pip install "$HOME"/mpmt-wheelhouse/mpmt-*.whl

      # -- Tests ------------------------------------------------
      - name: Run all tests
        run: python3 tests/run_all.py
